name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: dashboard-v8/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard-v8

      - name: Type check
        run: npx tsc --noEmit
        working-directory: dashboard-v8

      - name: Run tests
        run: npx vitest run
        working-directory: dashboard-v8
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Audit
        run: node scripts/audit.cjs
        working-directory: dashboard-v8

      - name: Build
        run: npm run build
        working-directory: dashboard-v8
