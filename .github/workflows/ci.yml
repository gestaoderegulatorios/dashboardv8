name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ '20.x' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install in dashboard-v8
        working-directory: ./dashboard-v8
        run: |
          npm ci
      - name: Run tests in dashboard-v8
        working-directory: ./dashboard-v8
        run: |
          npm test -- --run
      - name: TypeScript check
        working-directory: ./dashboard-v8
        run: |
          npx tsc --noEmit
      - name: Build
        working-directory: ./dashboard-v8
        run: |
          npm run build
